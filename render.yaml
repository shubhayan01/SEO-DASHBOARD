# Render Blueprint. In Render: New > Blueprint, point it at this repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: whitelabel-seo-dashboard
    runtime: node
    plan: starter            # a paid plan is required for a persistent disk
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # Persistent disk — without this, users.json/clients.json reset on redeploy.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random value
      - key: ADMIN_EMAIL
        sync: false           # set in dashboard
      - key: ADMIN_PASSWORD
        sync: false           # set in dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GOOGLE_PSI_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # BrightLocal (local SEO) — one agency key; Sync auto-maps every client.
      - key: BRIGHTLOCAL_API_KEY
        sync: false           # set in dashboard (secret)
      # Estimates fallback used by Sync's Phase B (traffic/keyword estimates).
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: OPENPAGERANK_API_KEY
        sync: false
